; ============================================================================
; PelletQ-AI ESP32 Formulation-Receive Bench Test — PlatformIO build config
; ============================================================================
; Cara pakai:
;   pio run                 # compile
;   pio run -t upload       # upload ke ESP32
;   pio device monitor      # serial monitor @115200
;
; Tidak ada TFT/servo di sini — hanya WiFi + esp-mqtt + ArduinoJson, untuk
; menguji apakah ESP32 menerima formulasi dari web lewat topic MQTT retained
; "pelletq/formulation".
; ============================================================================

[platformio]
; Komponen ESP-IDF ada di src/; wrapper-nya meng-include sketch root.
src_dir = src

[env:esp32dev]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board         = esp32dev
framework     = espidf
monitor_speed = 115200

board_build.partitions = partitions_singleapp_large.csv

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
