; ============================================================================
; PelletQ-AI ESP32 Relay On/Off Bench Test — PlatformIO build config
; ============================================================================
; Cara pakai:
;   pio run                 # compile
;   pio run -t upload       # upload ke ESP32
;   pio device monitor      # serial monitor @115200
;
; Tidak ada WiFi/MQTT/TFT/servo di sini — cuma satu GPIO output (relay),
; buat mengisolasi apakah masalah "LED relay nggak sesuai kode" ada di
; firmware atau di hardware (relay module/wiring).
; ============================================================================

[platformio]
; Komponen ESP-IDF ada di src/; wrapper-nya meng-include sketch root.
src_dir = src

[env:esp32dev]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board         = esp32dev
framework     = espidf
monitor_speed = 115200
