; ============================================================================
; PelletQ-AI ESP32 Hopper Gate Controller — PlatformIO build config
; ============================================================================
; Cara pakai:
;   pio run                 # compile
;   pio run -t upload       # upload ke ESP32
;   pio device monitor      # serial monitor @115200
;
; Semua konfigurasi TFT_eSPI di-inject lewat build_flags di bawah, jadi TIDAK
; perlu mengedit User_Setup.h di folder library sama sekali.
; ============================================================================

[platformio]
; Komponen ESP-IDF ada di src/; wrapper-nya meng-include sketch root.
src_dir = src

[env:esp32dev]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board         = esp32dev
framework     = espidf
monitor_speed = 115200

; Native esp-mqtt + esp_crt_bundle (TLS/CA bundle) push the binary past the
; default 1MB "single app" partition. PlatformIO's espidf builder selects the
; partition CSV via board_build.partitions (NOT the sdkconfig Kconfig option),
; so this is the setting that actually controls it. Board has 4MB flash, so
; use the larger single-app table (~1.46MB) instead of a custom partitions.csv.
board_build.partitions = partitions_singleapp_large.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_MOSI=13
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_MISO=-1
    -DSPI_FREQUENCY=27000000
    ; Font: default GLCD + FreeFonts (dipakai untuk angka suhu & banner)
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
