; ============================================================================
; PelletQ-AI ESP32 Hopper Gate Controller — PlatformIO build config
; ============================================================================
; Cara pakai:
;   pio run                 # compile
;   pio run -t upload       # upload ke ESP32
;   pio device monitor      # serial monitor @115200
;
; Semua konfigurasi TFT_eSPI di-inject lewat build_flags di bawah, jadi TIDAK
; perlu mengedit User_Setup.h di folder library sama sekali.
; ============================================================================

[platformio]
; Sketch (.ino) ada di folder ini juga, jadi src_dir menunjuk ke sini.
src_dir = .

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    madhephaestus/ESP32Servo@^3.0.5
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_MOSI=13
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_MISO=-1
    -DSPI_FREQUENCY=27000000
    ; Font: default GLCD + FreeFonts (dipakai untuk angka suhu & banner)
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
