; ============================================================================
; PelletQ-AI ESP32 Servo + Relay Bench Test — PlatformIO build config
; ============================================================================
; Cara pakai:
;   pio run                 # compile
;   pio run -t upload       # upload ke ESP32
;   pio device monitor      # serial monitor @115200
;
; Tidak ada WiFi/MQTT/TFT/thermocouple di sini — cuma servo gerbang hopper
; (PIN_SERVO) + relay pemanas (PIN_HEATER), buat mengisolasi apakah masalah
; "gerbang nggak mau buka/tutup" ada di firmware utama, di servo/relay
; module-nya, atau di rail 5V yang dipakai bareng.
; ============================================================================

[platformio]
; Komponen ESP-IDF ada di src/; wrapper-nya meng-include sketch root.
src_dir = src

[env:esp32dev]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board         = esp32dev
framework     = espidf
monitor_speed = 115200

; Versi ESP32Servo HARUS sama dengan firmware/pelletq_esp32/platformio.ini —
; perilaku attach/detach & alokasi channel LEDC-nya beda antar mayor version,
; dan itu persis yang sedang diuji di sini.
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
