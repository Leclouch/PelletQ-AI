services:
  postgres:
    image: postgres:16-alpine
    container_name: pelletq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pelletq
      POSTGRES_PASSWORD: pelletq_dev_password
      POSTGRES_DB: pelletq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelletq -d pelletq"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pelletq-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket (untuk dashboard real-time nanti)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  adminer:
    image: adminer:latest
    container_name: pelletq-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
