services:
  postgres:
    image: postgres:16-alpine
    container_name: pelletq-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: pelletq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pelletq_dev_password}
      POSTGRES_DB: pelletq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelletq -d pelletq"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pelletq-mosquitto
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  adminer:
    image: adminer:latest
    container_name: pelletq-adminer
    restart: unless-stopped
    network_mode: host
    depends_on:
      - postgres

  app:
    build:
      context: .
      target: runtime
      network: host
    container_name: pelletq-app
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pelletq:${POSTGRES_PASSWORD:-pelletq_dev_password}@localhost:5432/pelletq?schema=public
      MQTT_BROKER_URL: mqtt://localhost:1883
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: build
      network: host
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pelletq:${POSTGRES_PASSWORD:-pelletq_dev_password}@localhost:5432/pelletq?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["pnpm", "exec", "prisma"]
    profiles: ["tools"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pelletq-cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
      - mosquitto

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
