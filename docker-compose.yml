services:
  postgres:
    image: postgres:16-alpine
    container_name: pelletq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pelletq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pelletq_dev_password}
      POSTGRES_DB: pelletq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelletq -d pelletq"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pelletq-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"   # MQTT plain — lokal only, dipakai Next.js server di host yang sama
      - "8883:8883"             # MQTT TLS — publik, dipakai ESP32 (beda jaringan dari server)
      - "127.0.0.1:9001:9001"   # WebSocket — lokal only (belum dipakai apa pun)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  adminer:
    image: adminer:latest
    container_name: pelletq-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres

  app:
    build:
      context: .
      target: runtime
    container_name: pelletq-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pelletq:${POSTGRES_PASSWORD:-pelletq_dev_password}@postgres:5432/pelletq?schema=public
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pelletq:${POSTGRES_PASSWORD:-pelletq_dev_password}@postgres:5432/pelletq?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["pnpm", "exec", "prisma"]
    profiles: ["tools"]

  caddy:
    image: caddy:2
    container_name: pelletq-caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      MQTT_DOMAIN: ${MQTT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  caddy_data:
  caddy_config:
